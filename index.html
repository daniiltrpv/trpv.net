<!doctype html>
<html lang="en">
<head>
<title>Daniil Toropov</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap">
<style>
:root {
  --paper: #ECEEEC;
  --ink: #141716;
  --muted: #6B716E;
  --line: #D5D9D6;
  --serif: "Instrument Serif", "Times New Roman", Georgia, serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121413; --ink: #E7E9E6; --muted: #8C928F; --line: #2A2F2D; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #121413; --ink: #E7E9E6; --muted: #8C928F; --line: #2A2F2D; color-scheme: dark; }

html { background: var(--paper); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
.page {
  display: grid;
  justify-items: center;
  gap: 14px;
  max-width: 420px;
  margin: 0 auto;
  text-align: center;
  padding-block: clamp(32px, 8vw, 72px);
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 44px;
  line-height: 1;
}
nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }
nav a, nav button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: var(--muted);
  text-decoration: none;
  cursor: pointer;
  transition: color .2s ease;
}
nav a:hover, nav a:focus-visible, nav button:hover, nav button:focus-visible {
  color: var(--ink); text-decoration: underline; text-underline-offset: 3px; outline: none;
}
.ico { width: 16px; height: 16px; flex: none; }

dialog {
  width: min(272px, calc(100vw - 48px));
  box-sizing: border-box;
  padding: 16px 20px 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(10,12,11,.35); backdrop-filter: blur(3px); }
dialog[open] { animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.dlg-head h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 26px; }
.close { display: grid; place-items: center; width: 28px; height: 28px; margin-right: -6px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); cursor: pointer; }
.close:hover, .close:focus-visible { color: var(--ink); background: var(--line); outline: none; }
.close svg { width: 16px; height: 16px; }
.accts { list-style: none; margin: 0; padding: 0; }
.accts li + li { border-top: 1px solid var(--line); }
.accts a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 12px 0;
  color: var(--ink); text-decoration: none;
}
.accts a span { font-size: 13px; color: var(--muted); }
.accts a:hover strong, .accts a:focus-visible strong { text-decoration: underline; text-underline-offset: 3px; }
.accts a:focus-visible { outline: none; }
.accts strong { font-weight: 500; }

@media (max-width: 480px) {
  .page { justify-items: start; text-align: left; }
  nav { flex-direction: column; align-items: flex-start; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
</style>
</head>
<body>
<div class="page">
  <h1>Daniil Toropov</h1>
  <nav>

  </nav>
</div>

<dialog id="ig" aria-labelledby="ig-title">
  <div class="dlg-head">
    <h2 id="ig-title">Instagram</h2>
    <button type="button" class="close" id="ig-close" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>

    <li><a href="https://www.instagram.com/daniilsgarage/" target="_blank" rel="noopener"><strong>@daniilsgarage</strong><span>Cars</span></a></li>
    <li><a href="https://www.instagram.com/trpvmedia/" target="_blank" rel="noopener"><strong>@trpvmedia</strong><span>Photography</span></a></li>
  </ul>
</dialog>

<script>
  var d = document.getElementById('ig');
  document.getElementById('ig-open').addEventListener('click', function () { d.showModal(); });
  document.getElementById('ig-close').addEventListener('click', function () { d.close(); });
  d.addEventListener('click', function (e) {
    var r = d.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
  });
</script>

</html>
